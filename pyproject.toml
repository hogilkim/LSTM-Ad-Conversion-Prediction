[project]
name = "taobao"
version = "0.1.0"
description = "Conversion prediction from Taobao user behavior sequences: LSTM in PyTorch vs. a logistic regression baseline, time-based splits, FastAPI serving."
readme = "README.md"
authors = [
    { name = "hogyeongkim", email = "hogilkim@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.0",
    "torch>=2.14.0",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "kaggle>=2.2.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
